ignoreWorkspaceRootCheck: true

savePrefix: ''

shellEmulator: true

minimumReleaseAgeExclude:
  - '@nuxt/fonts@1.2.1'
  - fontless@1.4.0
  - fontaine@1.1.0
  - nuxt-nightly
  - '@nuxt/cli-nightly'
  - '@nuxt/kit-nightly'
  - '@nuxt/schema-nightly'
  - '@nuxt/nitro-server-nightly'
  - '@nuxt/vite-builder-nightly'
  - '@nuxt/vite-server-nightly'

overrides:
  # airspace and @atproto/lex each pull their own copy of these; without the
  # overrides the server bundle ships both.
  '@atproto/lex-client': 0.6.1
  '@atproto/lex-password-session': 0.3.5
  '@atproto/lex-schema': 0.3.1
  '@atproto/syntax': 0.7.9

allowBuilds:
  '*': false
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  workerd: false
