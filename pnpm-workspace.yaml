ignoreWorkspaceRootCheck: true

savePrefix: ''

shellEmulator: true

minimumReleaseAgeExclude:
  - '@nuxt/cli'
  - '@comark/nuxt@0.6.1'
  - '@comark/vue@0.6.1'
  - comark@0.6.1
  - '@bsky/sdk@1.0.0'
  - airspace@0.1.3
  - '@nuxt/kit@4.6.1'
  - '@nuxt/nitro-server@4.6.1'
  - '@nuxt/schema@4.6.1'
  - '@nuxt/vite-builder@4.6.1'
  - '@nuxt/vite-server@4.6.1'
  - nuxt@4.6.1

overrides:
  # comark-content@0.4.0 still pins ^0.6.2
  comark: 0.7.0
  rolldown: 1.2.13
  # airspace and @atproto/lex each pull their own copy of these; without the
  # overrides the server bundle ships both.
  '@atproto/lex-client': 0.3.7
  '@atproto/lex-password-session': 0.2.4
  '@atproto/lex-schema': 0.2.8
  '@atproto/syntax': 0.7.6

allowBuilds:
  '*': false
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  workerd: false
