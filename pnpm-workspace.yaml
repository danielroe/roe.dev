ignoreWorkspaceRootCheck: true

savePrefix: ''

shellEmulator: true

minimumReleaseAgeExclude:
  - '@nuxt/cli'
  - '@comark/nuxt@0.6.1'
  - '@comark/vue@0.6.1'
  - comark@0.6.1
  - '@bsky/sdk@1.0.0'
  - airspace@0.1.3
  - '@nuxt/kit@4.7.0'
  - '@nuxt/nitro-server@4.7.0'
  - '@nuxt/schema@4.7.0'
  - '@nuxt/vite-builder@4.7.0'
  - '@nuxt/vite-server@4.7.0'
  - '@nuxt/devtools@4.2.0'
  - nuxt@4.7.0
  - nitropack@2.14.0
  - fontaine@1.0.1
  - fontless@1.3.2
  - '@nuxt/fonts@1.0.1'
  - '@nuxt/nitro-v3-server@4.7.0'

overrides:
  # comark-content@0.4.0 still pins ^0.6.2
  comark: 0.9.2
  rolldown: 1.3.3
  # airspace and @atproto/lex each pull their own copy of these; without the
  # overrides the server bundle ships both.
  '@atproto/lex-client': 0.6.1
  '@atproto/lex-password-session': 0.3.5
  '@atproto/lex-schema': 0.3.1
  '@atproto/syntax': 0.7.9

allowBuilds:
  '*': false
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  sharp: true
  simple-git-hooks: true
  unrs-resolver: false
  workerd: false
